 if(st=='lobby'){NET.close();st='coop';mi=0;return}

 const it=MI[st][mi];

let ACtx=null,AMaster=null;
function audioOn(){try{if(!ACtx){const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;ACtx=new Ctx();AMaster=ACtx.createGain();AMaster.gain.value=.68;AMaster.connect(ACtx.destination)}if(ACtx.state==='suspended')ACtx.resume();}catch(e){ACtx=null;AMaster=null}}
function tone(f,d=.08,type='sine',vol=.12,to=0){audioOn();if(!ACtx)return;const o=ACtx.createOscillator(),g=ACtx.createGain(),now=ACtx.currentTime;o.type=type;o.frequency.setValueAtTime(Math.max(30,f),now);if(to) o.frequency.exponentialRampToValueAtTime(Math.max(30,to),now+d);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(vol,now+.006);g.gain.exponentialRampToValueAtTime(.0001,now+d);o.connect(g);g.connect(AMaster);o.start(now);o.stop(now+d+.02)}
function noise(d=.1,vol=.08,filter=900){audioOn();if(!ACtx)return;const n=ACtx.sampleRate*d|0,b=ACtx.createBuffer(1,n,ACtx.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=ACtx.createBufferSource(),f=ACtx.createBiquadFilter(),g=ACtx.createGain(),now=ACtx.currentTime;s.buffer=b;f.type='lowpass';f.frequency.value=filter;g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(.0001,now+d);s.connect(f);f.connect(g);g.connect(AMaster);s.start(now);s.stop(now+d)}
function sfx(k){
 audioOn();
 switch(k){
  case 'door': noise(.42,.22,1500); tone(78,.58,'sawtooth',.11,42); tone(180,.22,'triangle',.09,85); break;
  case 'powerdoor': noise(.18,.12,2600); tone(110,.38,'sawtooth',.12,52); tone(360,.55,'triangle',.10,900); break;
  case 'slash': noise(.14,.14,3200); tone(300,.11,'sawtooth',.10,1050); tone(760,.07,'square',.055,1200); break;
  case 'gaunt': tone(72,.18,'square',.09,210); tone(190,.25,'triangle',.10,55); noise(.12,.08,1200); break;
  case 'shock': noise(.3,.22,2100); tone(58,.32,'square',.10,30); tone(480,.2,'sine',.08,150); break;
  case 'hit': noise(.09,.16,1900); tone(155,.09,'square',.09,65); break;
  case 'enemy': noise(.24,.20,1100); tone(240,.2,'sawtooth',.09,55); tone(90,.25,'triangle',.06,35); break;
  case 'hurt': noise(.15,.18,800); tone(105,.22,'square',.11,48); break;
  case 'jump': tone(220,.12,'triangle',.09,620); noise(.07,.08,1800); break;
  case 'dash': noise(.2,.16,3000); tone(105,.18,'sawtooth',.10,850); break;
  case 'pickup': tone(480,.10,'sine',.09,720); tone(720,.12,'sine',.08,980); tone(980,.16,'sine',.07,1320); break;
  case 'switch': tone(250,.10,'square',.08,400); tone(560,.18,'sine',.08,880); break;
  case 'explode': noise(.42,.28,850); tone(58,.34,'sawtooth',.13,30); break;
  case 'disc': tone(430,.09,'sine',.10,900); noise(.1,.09,3200); break;
  case 'menuNav': tone(360,.045,'square',.045,420); break;
  case 'menuSelect': tone(520,.07,'triangle',.07,760); break;
  case 'pause': tone(220,.12,'sine',.08,110); break;
  case 'resume': tone(220,.09,'sine',.07,420); break;
  case 'dialog': tone(520,.035,'square',.035,470); break;
  case 'terminal': tone(260,.07,'square',.055,390); tone(780,.05,'sine',.04,980); break;
  case 'hack': tone(180,.12,'sawtooth',.07,360); noise(.08,.05,2400); break;
  case 'checkpoint': tone(300,.12,'triangle',.07,520); tone(620,.18,'sine',.08,1040); break;
  case 'heal': tone(250,.18,'sine',.06,520); tone(520,.24,'triangle',.07,920); noise(.16,.045,1500); break;
  case 'ability': tone(110,.22,'sawtooth',.07,440); tone(440,.3,'triangle',.08,1100); noise(.18,.05,2200); break;
  case 'step': noise(.055,.035,700); tone(75,.05,'triangle',.025,55); break;
  case 'land': noise(.09,.07,500); tone(90,.08,'sine',.035,55); break;
  case 'wall': tone(150,.055,'square',.035,120); noise(.045,.025,1000); break;
  case 'hackdone': tone(430,.08,'square',.05,700); tone(820,.14,'sine',.06,1200); break;
  case 'locked': tone(90,.12,'square',.055,55); break;
  case 'shopMove': tone(300,.04,'square',.035,350); break;
  case 'shopBuy': tone(420,.08,'triangle',.07,700); tone(700,.12,'sine',.06,980); break;
  case 'shopError': tone(140,.13,'sawtooth',.055,90); break;
  case 'room': noise(.18,.055,1000); tone(95,.22,'triangle',.045,170); break;
  case 'gate': tone(160,.12,'sawtooth',.05,420); noise(.18,.07,1800); break;
  case 'death': tone(180,.35,'sine',.08,45); noise(.4,.12,700); break;
  case 'win': tone(330,.16,'sine',.07,660); tone(660,.22,'triangle',.08,990); tone(990,.34,'sine',.06,1320); break;
  case 'boss': tone(70,.45,'sawtooth',.08,45); noise(.3,.08,420); break;
  case 'enemyattack': noise(.12,.06,1200); tone(120,.16,'sawtooth',.045,70); break;
 }
}
addEventListener('pointerdown',audioOn,{once:false});
addEventListener('touchstart',audioOn,{once:false,passive:true});
addEventListener('keydown',audioOn,{once:false});
const my=()=>st=='title'?350:st=='lobby'?400:250;
C.addEventListener('pointerdown',e=>{if(lis||st=='play')return;const r=C.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
 if(st=='win'){if(winT>3){sfx('menuSelect');NET.close();init();st='title';mi=0}return}
 if(st=='keys'){const i=Math.round((y-142)/32);if(i>=0&&i<AC.length+2){mi=i;if(i<AC.length)mc=x>650?1:0;act()}return}
 const i=Math.round((y-my()+8)/46);if(i>=0&&i<MI[st].length){mi=i;sfx('menuSelect');act()}});

const CH=['Red Hood','Blue Hood'];
function setCh(){const l='Character: '+CH[p.ch|0];MI.title[2]=l;MI.coop[2]=l}
let role='a';
const rp={wn:0,on:0,x:80,y:438,tx:80,ty:438,w:22,h:40,vx:0,vy:0,face:1,atk:0,dir:'s',dash:0,sq:0,wt:0,inv:0,foc:0,ground:1,ch:1,room:-1,ro:'a',at:.14,big:0,chg:0,rt:0,dc:0,dd:null,cl:0,cls:0};
const rs2={x:0,y:0,tx:0,ty:0,i:0,fc:1,lit:0,hk:0,sv:1};
// followers apply the partner's enemy snapshots; only when both players share a room and the partner owns it
const fol=()=>NET.on&&rp.on&&rp.room===room&&role=='f';
const NET={on:0,h:0,g:0,code:'',msg:'',peer:null,conn:null,
 send(m){try{if(this.conn&&this.conn.open)this.conn.send(m)}catch(e){}},
 close(){this.on=this.h=this.g=0;rp.on=0;rp.room=-1;rp.dd=null;rs2.i=0;role='a';try{if(this.conn)this.conn.close();if(this.peer)this.peer.destroy()}catch(e){}this.peer=this.conn=null;this.code=''}};
function wire(c){const o=()=>{NET.on=1;rp.on=1;NET.msg='Connected';if(NET.h){init();go();NET.send({t:'start'})}};
 if(c.open)o();else c.on('open',o);
 c.on('data',onMsg);c.on('close',()=>{if(NET.on){NET.on=0;rp.on=0;msg=['Your partner has gone','The signal grows quiet'];msgT=4}});c.on('error',()=>{})}
function hostGame(){NET.close();st='lobby';mi=0;if(!window.Peer){NET.msg='Network library failed to load';return}
 const code=Array.from({length:4},()=>'ABCDEFGHJKMNPQRSTUVWXYZ'[Math.random()*23|0]).join('');NET.code=code;NET.h=1;NET.msg='Waiting for a partner';
 const pe=NET.peer=new Peer('hollowfall-'+code);pe.on('error',e=>{NET.msg=e.type=='unavailable-id'?'Code taken, go back and retry':'Connection error: '+e.type});
 pe.on('connection',c=>{if(NET.conn)return;NET.conn=c;wire(c)})}
function joinGame(){const c=(prompt('Enter room code')||'').trim().toUpperCase();if(!c)return;NET.close();st='lobby';mi=0;
 if(!window.Peer){NET.msg='Network library failed to load';return}
 NET.g=1;NET.code=c;NET.msg='Connecting';const pe=NET.peer=new Peer();
 pe.on('error',e=>NET.msg=e.type=='peer-unavailable'?'No room with that code':'Connection error: '+e.type);
 pe.on('open',()=>{NET.conn=pe.connect('hollowfall-'+c,{reliable:true,serialization:'json'});wire(NET.conn)})}
function captureRoom(){const shot=document.createElement('canvas');shot.width=W;shot.height=H;try{shot.getContext('2d').drawImage(C,0,0)}catch(e){}return shot}
var FWX=0;
function goRoom(r,send,how){const old=room,wx0=FWX;if(R[r].n==='Reliquary of Blades'&&R[old].n!=='Silent Signal')R[r].l=old;how=how||(r>old?'r':'l');roomFx=null;
 // Save the exact live enemy instances before changing rooms. Do not clone/migrate them on top
 // of the destination room's own enemies: that caused duplicates and fresh-spawn resets.
 
 load(r);FWX=wx0;fade=0;p.wi=0;
 // Seamless handoff: only the coordinate origin changes; enemy state remains owned by its room.
 if(how=='r'||how=='l'){const fw=how=='r';FWX+=fw?W:-W;p.x+=fw?-W:W;cmx+=fw?-W:W;p.sx=fw?88:W-88-p.w;
  if(fw){nbL=old;S=S.filter(s=>s.door||s.x>=0||s.h<15*T)}else{nbR=old;S=S.filter(s=>s.door||s.x<W||s.h<15*T)}}
 else if(how=='u'){const l=R[r].d;p.y+=H;cmy+=H;p.vy=Math.min(p.vy,-460);p.sx=Math.max(l.gx*T+6,Math.min((l.gx+l.gw)*T-p.w-6,p.x))}
 else{const l=R[r].u;p.y-=H;cmy-=H;p.x=Math.max(l.gx*T+6,Math.min((l.gx+l.gw)*T-p.w-6,p.x));p.vy=Math.max(160,p.vy);p.sx=64}try{const dx=how=='r'?-W:how=='l'?W:0,dy=how=='u'?H:(how=='r'||how=='l')?0:-H;
  for(const a of[fx,rg,shk,tc])for(const o of a){o.x+=dx;o.y+=dy}PFX.shift(dx,dy)}catch(e){}
 syncWorld(true)}
function remoteHit(j){const e=en.find(x=>x.j==j);if(!e)return;sfx('hit');e.hp--;e.fl=.1;e.al=1;rg.push({x:e.x+e.w/2,y:e.y+e.h/2,l:.25,m:.25});spark(e.x+e.w/2,e.y+e.h/2,'#e8f4ff',8,200);
 if(e.hp<=0){sfx('enemy');smallBoom(e);dead[e.rm==null?room:e.rm][e.j]=1;spark(e.x+e.w/2,e.y+e.h/2,'#ffd36b',16,240);en.splice(en.indexOf(e),1);if(e.b)bossDown(e)}}
function snap(m){const seen=new Set();for(const a of m.e){const e=en.find(x=>x.j==a[0]);if(!e)continue;seen.add(e);e.tx=a[1];e.ty=a[2];e.hp=a[3];e.dir=a[4];e.ground=a[5];e.tm=a[6];e.air=a[7];e.ms=a[8]|0}
 for(const e of [...en])if(!seen.has(e)){spark(e.x+e.w/2,e.y+e.h/2,'#ffd36b',16,240);en.splice(en.indexOf(e),1)}
 pr=m.p.map(a=>({x:a[0],y:a[1],w:a[2],h:a[3],vx:a[4],vy:a[5]||0,k:a[6]||0}))}
function shockVis(x,y,r,d){sfx('enemyattack');sfx('shock');shk.push({x,y,l:.55,m:.55,r});shk.push({x,y,l:.4,m:.4,r:r*.6});shake=Math.max(shake,d>2?7:5);dust(x,y,14);spark(x,y-8,'#ffb347',34,440);spark(x,y-8,'#7fe8ff',22,340)}
function onMsg(m){switch(m.t){
 case 'start':init();go();break;
 case 'b':pb.push({x:m.x,y:m.y,vx:m.vx,vy:m.vy,l:m.l,m:m.l,c:m.ch?'#6fe3ff':'#9dff6a',ch:m.ch,r:1});break;
 case 'p':{const rm=m.r|0,sn=rm!==rp.room||(rp.ty>900&&m.y<900);
  Object.assign(rp,{tx:m.x,ty:m.y,vx:m.vx,vy:m.vy,face:m.f,atk:m.a,dir:m.d,dash:m.da,inv:m.i,foc:m.fo,ground:m.gr,ch:m.c,wn:m.wn|0,sq:m.sq,at:m.at||.14,big:m.bg|0,chg:m.cg||0,rt:m.rt|0,dc:m.dc||0,cl:m.cl|0,cls:m.cls|0,ro:m.ro,room:rm});
  if(sn){rp.x=m.x;rp.y=m.y;rs2.i=0}
  rs2.tx=m.sx;rs2.ty=m.sy;rs2.fc=m.sf||1;rs2.lit=m.sl||0;rs2.hk=m.hk||0;rs2.sv=m.sv;if(!rs2.i){rs2.x=m.sx;rs2.y=m.sy;rs2.i=1}
  if(rm!==room)role='a';else if(NET.h&&m.ro=='f'&&role=='f')role='a';else if(NET.g&&m.ro=='a'&&role=='a')role='f';
  break}
 case 's':if(fol()&&m.r==room)snap(m);break;
 case 'h':if(!fol()&&m.r==room)remoteHit(m.j);break;

})();
